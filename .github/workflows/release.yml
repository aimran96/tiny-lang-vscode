name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npm test
      - name: Interpreter smoke test (English + Hindi)
        run: |
          java -Dfile.encoding=UTF-8 -jar tinylang/Interpreter.jar tinylang/test.english
          java -Dfile.encoding=UTF-8 -jar tinylang/Interpreter.jar tinylang/test.hindi
      - run: npx vsce package --no-yarn
      - name: Publish GitHub release with .vsix
        uses: softprops/action-gh-release@v2
        with:
          files: '*.vsix'
          generate_release_notes: true
